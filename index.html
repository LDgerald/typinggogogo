<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>打字gogogo · 完整版</title>
    <link rel="manifest" href="data:application/json;base64,...">
    <meta name="theme-color" content="#2ecc71">
    <script src="https://unpkg.com/pinyin-pro@3.20.4/dist/index.js"></script>
    <style>
        :root {
            --bg: #1a2421;
            --container-bg: radial-gradient(circle at center, #162e22, #0b4229);
            --accent: #2ecc71;
            --word-color: #f1f1f1;
            --word-active: #2ecc71;
            --ui-bg: rgba(0,0,0,0.3);
            --btn-bg: rgba(255,255,255,0.15);
            --btn-hover: rgba(46,204,113,0.4);
            --text-color: white;
            --input-bg: rgba(255,255,255,0.12);
            --pinyin-color: rgba(200,255,220,0.7);
            --design-width: 1280px;
            --design-height: 800px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; overflow: hidden; background: var(--bg);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; color: var(--text-color); user-select: none;
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        #gameContainer {
            width: var(--design-width); height: var(--design-height);
            position: relative; background: var(--container-bg);
            transform-origin: center center; box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 10px; overflow: hidden;
        }
        #startOverlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
            flex-direction: column; gap:30px;
        }
        #startOverlay.hidden { display: none; }
        #startBtn {
            font-size: 2rem; padding: 20px 60px; border-radius: 50px; background: var(--accent);
            border: none; color: white; cursor: pointer; letter-spacing: 4px; font-weight: bold;
            box-shadow: 0 0 30px rgba(0,0,0,0.5); transition: transform 0.2s;
        }
        #startBtn:hover { transform: scale(1.08); }
        #topBar {
            position: absolute; top:10px; left:15px; right:15px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            gap:8px; z-index: 60;
        }
        #title {
            font-size: 1.4rem; font-weight: bold; color: var(--accent);
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7); margin:0; white-space: nowrap;
            cursor: pointer; display: flex; align-items: center; gap:5px;
        }
        #title:hover { text-decoration: underline; }
        #scoreBoard {
            font-size: 0.85rem; background: var(--ui-bg); padding: 4px 10px;
            border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap; display: flex; align-items: center; gap:8px;
        }
        #currentRole { font-size: 0.7rem; opacity: 0.8; }
        .setting-group {
            display: flex; flex-direction: column; align-items: flex-start; gap:2px;
            background: var(--ui-bg); padding: 4px 8px; border-radius: 12px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); font-size:0.7rem;
        }
        .setting-group label { opacity: 0.8; }
        .setting-group select {
            background: rgba(0,0,0,0.6); color: var(--text-color); border: 1px solid rgba(255,255,255,0.3);
            padding: 3px 5px; border-radius: 8px; cursor: pointer; font-size:0.75rem; outline: none;
        }
        #speedPanel {
            display: flex; align-items: center; gap:6px; background: var(--ui-bg);
            padding: 4px 10px; border-radius: 15px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); font-size:0.75rem;
        }
        #speedSlider { width: 70px; accent-color: var(--accent); cursor: pointer; }
        #speedValue { min-width: 30px; text-align: center; font-weight: bold; color: var(--accent); }
        #controlBtns { display: flex; gap: 6px; }
        .btn {
            background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.25); color: var(--text-color);
            padding: 5px 12px; border-radius: 15px; font-size:0.75rem; cursor: pointer;
            backdrop-filter: blur(8px); transition: all 0.2s; white-space: nowrap;
        }
        .btn:hover { background: var(--btn-hover); border-color: var(--accent); }
        #profileModal {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 200;
        }
        #profileModal.show { display: flex; }
        .profile-panel {
            background: rgba(20,20,50,0.95); border: 2px solid var(--accent);
            border-radius: 20px; padding: 20px; width: 350px; max-height: 450px;
            display: flex; flex-direction: column; gap:15px; color: white;
        }
        .profile-list { display: flex; flex-direction: column; gap:10px; overflow-y: auto; max-height: 250px; }
        .profile-card {
            background: rgba(255,255,255,0.08); padding: 10px 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid transparent; cursor: pointer; transition: all 0.2s;
        }
        .profile-card.active { border-color: var(--accent); background: rgba(46,204,113,0.3); }
        .profile-info { display: flex; flex-direction: column; }
        .profile-name { font-weight: bold; font-size: 1.1rem; }
        .profile-stats { font-size: 0.75rem; opacity: 0.7; display: flex; gap:10px; }
        .profile-actions { display: flex; gap:8px; }
        .profile-actions button {
            background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white;
            border-radius: 8px; padding: 2px 8px; font-size:0.7rem; cursor: pointer;
        }
        .new-profile-btn { margin-top: 5px; align-self: center; }
        #newProfileName {
            background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 10px; border-radius: 8px; width: 100%; margin-top: 5px; display: none;
        }
        #historyBtn, #progressBtn {
            position: absolute; right: 10px; z-index: 65; writing-mode: vertical-lr;
            letter-spacing: 3px; background: var(--accent); border: none; color: white;
            padding: 10px 5px; border-radius: 12px; font-size:0.8rem; cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #historyBtn { top: 30%; transform: translateY(-50%); }
        #progressBtn { top: 50%; transform: translateY(-50%); background: #ffa500; }
        #pauseOverlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); display: none;
            justify-content: center; align-items: center; z-index: 50;
            font-size: 2.5rem; font-weight: bold; letter-spacing: 6px; color: white;
            text-shadow: 0 0 25px var(--accent); cursor: pointer;
        }
        #pauseOverlay.visible { display: flex; }
        #gameOverMsg {
            position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 25px 40px; border-radius: 20px;
            text-align: center; font-size: 1.3rem; backdrop-filter: blur(10px);
            border: 2px solid var(--accent); display: none; z-index: 60; animation: fadeIn 0.4s;
        }
        #gameOverMsg.show { display: block; }
        @keyframes fadeIn { from { opacity:0; transform: translate(-50%, -40px); } to { opacity:1; transform: translate(-50%, -50%); } }
        #comboDisplay {
            position: absolute; top:90px; left:50%; transform: translateX(-50%);
            font-size: 2rem; font-weight: bold; color: #ffd700;
            text-shadow: 0 0 20px #ffaa00, 0 0 40px #ff6600; z-index: 40;
            transition: opacity 0.15s; opacity:0; pointer-events: none; white-space: nowrap;
        }
        .combo-active { opacity: 1 !important; }
        #inputBox {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 10px 20px; font-size: 1.1rem; border: 2px solid var(--accent);
            border-radius: 20px; background: var(--input-bg); backdrop-filter: blur(10px);
            color: var(--text-color); text-align: center; outline: none; z-index: 30; width: 260px;
            letter-spacing: 2px; transition: all 0.3s;
        }
        #inputBox:focus { box-shadow: 0 0 20px var(--accent); background: rgba(255,255,255,0.18); }
        #inputBox::placeholder { color: rgba(255,255,255,0.5); }
        #missDisplay {
            position: absolute; bottom: 40px; right: 15px; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px); padding: 5px 12px; border-radius: 12px; font-size:0.9rem;
            border: 1px solid rgba(255,255,255,0.3); z-index: 30;
        }
        #mistakePanel, #progressPanel {
            position: absolute; right: 55px; top: 8%; width: 220px; max-height: 68%;
            background: rgba(20,20,40,0.95); backdrop-filter: blur(10px);
            border: 2px solid var(--accent); border-radius: 15px; padding: 10px;
            z-index: 60; overflow-y: auto; display: none; flex-direction: column; gap:8px;
        }
        #progressPanel { border-color: #ffa500; }
        .visible { display: flex !important; }
        .mistake-item {
            display: flex; flex-direction: column; align-items: flex-start; position: relative;
            background: rgba(255,255,255,0.08); padding: 5px 8px; border-radius: 8px;
        }
        .mistake-word { font-size: 1rem; font-weight: bold; color: #ffcccb; }
        .mistake-badge {
            position: absolute; top: -6px; right: -6px; background: var(--accent); color: white;
            border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center;
            justify-content: center; font-size: 0.65rem;
        }
        .mistake-pinyin { font-size: 0.7rem; color: #aaa; margin-top: 2px; }
        .word {
            position: absolute; font-size: 2.4rem; font-weight: bold; color: var(--word-color);
            text-shadow: 0 2px 6px black; pointer-events: none; transition: color 0.15s, transform 0.1s;
            white-space: nowrap; display: flex; flex-direction: column; align-items: center;
        }
        .word .pinyin {
            font-size: 1.05rem; font-weight: normal; color: var(--pinyin-color);
            text-shadow: 0 1px 2px black; margin-top: 2px;
        }
        .word.active { color: var(--word-active); transform: scale(1.05); animation: pulse 0.8s infinite; }
        @keyframes pulse { 0% { text-shadow: 0 0 10px var(--accent); } 50% { text-shadow: 0 0 20px var(--accent); } 100% { text-shadow: 0 0 10px var(--accent); } }
        .word.exploding { animation: explodeWord 0.4s ease-out forwards !important; pointer-events: none; }
        @keyframes explodeWord { 0% { color: #00ff88; transform: scale(1.5); opacity:1; } 100% { opacity:0; } }
        .score-popup { position: absolute; font-size: 2.2rem; font-weight: bold; color: #ffd700; z-index: 80; animation: floatUp 0.8s ease-out forwards; }
        @keyframes floatUp { 0% { opacity:1; transform: translateY(0) scale(0.5); } 100% { opacity:0; transform: translateY(-90px) scale(1); } }
    </style>
</head>
    <script>
(function() {
    // 音效
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
    function playTone(freq, type='sine', duration=0.1, vol=0.3) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    // DOM 元素
    const gameContainer = document.getElementById('gameContainer');
    const inputBox = document.getElementById('inputBox');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const pauseBtn = document.getElementById('pauseBtn');
    const newGameBtn = document.getElementById('newGameBtn');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const gameOverMsg = document.getElementById('gameOverMsg');
    const finalScoreSpan = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');
    const missCountSpan = document.getElementById('missCount');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    const historyBtn = document.getElementById('historyBtn');
    const mistakePanel = document.getElementById('mistakePanel');
    const progressBtn = document.getElementById('progressBtn');
    const progressPanel = document.getElementById('progressPanel');
    const progressCanvas = document.getElementById('progressCanvas');
    const comboDisplay = document.getElementById('comboDisplay');
    const modeSelect = document.getElementById('modeSelect');
    const difficultySelect = document.getElementById('difficultySelect');
    const difficultyGroup = document.getElementById('difficultyGroup');
    const themeSelect = document.getElementById('themeSelect');
    const colorSelect = document.getElementById('colorSelect');
    const titleEl = document.getElementById('title');
    const roleLabel = document.getElementById('roleLabel');
    const profileModal = document.getElementById('profileModal');
    const profileList = document.getElementById('profileList');
    const addProfileBtn = document.getElementById('addProfileBtn');
    const newProfileName = document.getElementById('newProfileName');
    const confirmAddBtn = document.getElementById('confirmAddBtn');
    const cancelAddBtn = document.getElementById('cancelAddBtn');
    const closeProfileBtn = document.getElementById('closeProfileBtn');

    const DESIGN_WIDTH = 1280;
    const DESIGN_HEIGHT = 800;

    // 配色方案定义
    const colorSchemes = {
        green: { bg:'#1a2421', containerBg:'radial-gradient(circle at center, #162e22, #0b4229)', accent:'#2ecc71', word:'#f1f1f1', wordActive:'#2ecc71', uiBg:'rgba(0,0,0,0.3)', btnBg:'rgba(255,255,255,0.15)', btnHover:'rgba(46,204,113,0.4)', text:'white', inputBg:'rgba(255,255,255,0.12)', pinyin:'rgba(200,255,220,0.7)' },
        coffee: { bg:'#2c2416', containerBg:'radial-gradient(circle at center, #3e2e1a, #1f1500)', accent:'#e67e22', word:'#f5f0e6', wordActive:'#e67e22', uiBg:'rgba(0,0,0,0.3)', btnBg:'rgba(255,255,255,0.15)', btnHover:'rgba(230,126,34,0.4)', text:'white', inputBg:'rgba(255,255,255,0.12)', pinyin:'rgba(255,220,180,0.7)' },
        ocean: { bg:'#1b2a3a', containerBg:'radial-gradient(circle at center, #1e3448, #0f1a26)', accent:'#5dade2', word:'#f1f1f1', wordActive:'#5dade2', uiBg:'rgba(0,0,0,0.3)', btnBg:'rgba(255,255,255,0.15)', btnHover:'rgba(93,173,226,0.4)', text:'white', inputBg:'rgba(255,255,255,0.12)', pinyin:'rgba(180,220,255,0.7)' },
        purple: { bg:'#282234', containerBg:'radial-gradient(circle at center, #362a48, #1b1326)', accent:'#bb8fce', word:'#f1f1f1', wordActive:'#bb8fce', uiBg:'rgba(0,0,0,0.3)', btnBg:'rgba(255,255,255,0.15)', btnHover:'rgba(187,143,206,0.4)', text:'white', inputBg:'rgba(255,255,255,0.12)', pinyin:'rgba(220,200,240,0.7)' },
        light: { bg:'#f5f5f5', containerBg:'#ffffff', accent:'#333333', word:'#222222', wordActive:'#e94560', uiBg:'rgba(0,0,0,0.05)', btnBg:'rgba(0,0,0,0.08)', btnHover:'rgba(0,0,0,0.15)', text:'#222222', inputBg:'rgba(0,0,0,0.05)', pinyin:'rgba(0,0,0,0.55)' }
    };

    function applyColorScheme(name) {
        const s = colorSchemes[name];
        const root = document.documentElement.style;
        root.setProperty('--bg', s.bg);
        root.setProperty('--container-bg', s.containerBg);
        root.setProperty('--accent', s.accent);
        root.setProperty('--word-color', s.word);
        root.setProperty('--word-active', s.wordActive);
        root.setProperty('--ui-bg', s.uiBg);
        root.setProperty('--btn-bg', s.btnBg);
        root.setProperty('--btn-hover', s.btnHover);
        root.setProperty('--text-color', s.text);
        root.setProperty('--input-bg', s.inputBg);
        root.setProperty('--pinyin-color', s.pinyin);
        if (name === 'light') {
            gameContainer.style.boxShadow = '0 0 30px rgba(0,0,0,0.15)';
            inputBox.style.borderColor = '#333';
        } else {
            gameContainer.style.boxShadow = '0 0 50px rgba(0,0,0,0.8)';
        }
        localStorage.setItem('typingColorScheme', name);
    }

    const savedColor = localStorage.getItem('typingColorScheme') || 'green';
    colorSelect.value = savedColor;
    applyColorScheme(savedColor);
    colorSelect.addEventListener('change', (e) => applyColorScheme(e.target.value));

    // 数据管理（角色相关）
    const STORAGE_KEY = 'typingGameProfiles';
    function loadAllProfiles() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
        const oldMistake = JSON.parse(localStorage.getItem('mistakeHistory') || '{}');
        const oldProgress = JSON.parse(localStorage.getItem('typingProgress') || '{}');
        const defaultProfile = {
            id: generateId(), name: '打字新手', createdAt: new Date().toISOString(),
            mistakeHistory: oldMistake, progressData: oldProgress
        };
        return { currentProfileId: defaultProfile.id, profiles: [defaultProfile] };
    }
    function saveAllProfiles(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

    let appData = loadAllProfiles();
    let currentProfile = appData.profiles.find(p => p.id === appData.currentProfileId) || appData.profiles[0];

    function getCurrentProfile() { return currentProfile; }
    function updateCurrentProfileId(id) {
        appData.currentProfileId = id;
        currentProfile = appData.profiles.find(p => p.id === id);
        saveAllProfiles(appData);
    }
    function recordMistake(word) {
        if (!word) return;
        const p = getCurrentProfile();
        p.mistakeHistory[word] = (p.mistakeHistory[word] || 0) + 1;
        saveAllProfiles(appData);
        renderMistakePanel();
    }
    function saveDailyProgress(scoreVal, totalChars) {
        const today = new Date().toISOString().slice(0,10);
        const p = getCurrentProfile();
        if (!p.progressData[today]) p.progressData[today] = { scores: [], totalChars: 0 };
        p.progressData[today].scores.push(scoreVal);
        p.progressData[today].totalChars += totalChars;
        saveAllProfiles(appData);
    }
    function drawProgressChart() {
        const ctx = progressCanvas.getContext('2d');
        const p = getCurrentProfile();
        const days = Object.keys(p.progressData).sort().slice(-7);
        ctx.clearRect(0,0,progressCanvas.width,progressCanvas.height);
        if(days.length===0){ ctx.fillStyle='#aaa'; ctx.fillText('暂无数据',30,60); return; }
        const maxScore = Math.max(...days.map(d=>Math.max(...p.progressData[d].scores)), 10);
        const barW = 14, gap = (180 - days.length*barW)/(days.length+1);
        ctx.fillStyle = '#ffa500'; ctx.font = '9px sans-serif';
        days.forEach((d,i)=>{
            const x = gap + i*(barW+gap);
            const best = Math.max(...p.progressData[d].scores);
            const h = (best/maxScore)*80;
            ctx.fillRect(x, 90-h, barW, h);
            ctx.fillStyle = '#fff';
            ctx.fillText(d.slice(5), x, 105);
            ctx.fillStyle = '#ffa500';
        });
    }
    function renderMistakePanel() {
        mistakePanel.innerHTML = '';
        const p = getCurrentProfile();
        const entries = Object.entries(p.mistakeHistory).sort((a,b)=>b[1]-a[1]);
        if(!entries.length){ mistakePanel.innerHTML='<div style="color:#aaa; text-align:center;">暂无错词</div>'; return; }
        for(const [word,count] of entries){
            const div = document.createElement('div'); div.className='mistake-item';
            div.innerHTML = `<span class="mistake-word">${word}</span><span class="mistake-badge">${count}</span><span class="mistake-pinyin">${getPinyin(word)}</span>`;
            mistakePanel.appendChild(div);
        }
    }

    // 角色 UI
    function renderProfiles() {
        profileList.innerHTML = '';
        appData.profiles.forEach(profile => {
            const card = document.createElement('div');
            card.className = 'profile-card' + (profile.id === appData.currentProfileId ? ' active' : '');
            const bestScore = Math.max(...Object.values(profile.progressData).flatMap(d=>d.scores), 0);
            const mistakeCount = Object.values(profile.mistakeHistory).reduce((a,b)=>a+b,0);
            card.innerHTML = `<div class="profile-info"><span class="profile-name">${profile.name}</span><span class="profile-stats"><span>🏆 ${bestScore}</span><span>❌ ${mistakeCount}</span></span></div><div class="profile-actions">${profile.id !== appData.currentProfileId ? '<button class="switch-btn">使用</button>' : '<span style="color:var(--accent);">✔ 使用中</span>'}<button class="delete-btn">🗑️</button></div>`;
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-btn') || e.target.classList.contains('switch-btn')) return;
                if (profile.id !== appData.currentProfileId) {
                    if (gameStarted && !isGameOver) { if (!confirm('切换角色将结束当前游戏，确定吗？')) return; endGame(false); }
                    updateCurrentProfileId(profile.id);
                    renderProfiles(); updateRoleLabel(); clearAllWords(); stopGameLoop(); resetGameState();
                }
            });
            card.querySelector('.switch-btn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (gameStarted && !isGameOver) { if (!confirm('切换角色将结束当前游戏，确定吗？')) return; endGame(false); }
                updateCurrentProfileId(profile.id);
                renderProfiles(); updateRoleLabel(); clearAllWords(); stopGameLoop(); resetGameState();
            });
            card.querySelector('.delete-btn')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (appData.profiles.length <= 1) { alert('至少保留一个角色！'); return; }
                if (confirm(`确定删除角色“${profile.name}”及其所有数据吗？此操作不可恢复。`)) {
                    appData.profiles = appData.profiles.filter(p => p.id !== profile.id);
                    if (appData.currentProfileId === profile.id) {
                        appData.currentProfileId = appData.profiles[0].id;
                        currentProfile = appData.profiles[0];
                    }
                    saveAllProfiles(appData);
                    renderProfiles(); updateRoleLabel();
                }
            });
            profileList.appendChild(card);
        });
        addProfileBtn.disabled = appData.profiles.length >= 5;
        addProfileBtn.textContent = appData.profiles.length >= 5 ? '角色已满 (5/5)' : '➕ 新建角色';
    }
    function updateRoleLabel() { roleLabel.textContent = currentProfile.name; }
    function showProfileModal() { renderProfiles(); profileModal.classList.add('show'); }
    function hideProfileModal() { profileModal.classList.remove('show'); newProfileName.style.display='none'; confirmAddBtn.style.display='none'; cancelAddBtn.style.display='none'; }
    addProfileBtn.addEventListener('click', () => {
        if (appData.profiles.length >= 5) return;

    cancelAddBtn.addEventListener('click', () => {

    // 游戏状态
    let score = 0, activeWords = [], animationId = null, isPaused = false, isGameOver = false;

    let currentDifficulty = 'medium', currentTheme = 'standard', currentMode = 'normal';

    // 词库 (各100词)

    const internetWords = "绝绝子,内卷,躺平,破防,emo,yyds,nsdd,u1s1,dddd,爷青回,集美,芭比Q,栓Q,炫饭,显眼包,泰裤辣,家人们,上链接,摆烂,摸鱼,凡尔赛,社恐,社牛,吸猫,撸狗,干饭人,打工人,工具人,尾款人,气氛组,破圈,出圈,后浪,前浪,吃瓜,吃鸡,开黑,带飞,坑货,下饭,弹幕,宝藏,安利,排雷,种草,拔草,真香,打脸,上头,下头,蹭热度,热搜,塌房,翻车,糊了,名场面,回忆杀,爷童回,DNA动了,我酸了,我没了,我哭了,我好了,我又行了,裂开,人麻了,离谱,离大谱,绷不住了,蚌埠住了,雷人,震惊,辣眼睛,洗眼睛,醉了,也是醉了,佛了,我佛了,奥利给,skr,单推,双厨狂喜,迫害,整活,绝活,手艺活,鬼畜,魔性,上头,洗脑,循环,入坑,退坑,回坑,云玩家,键政,杠精,喷子,黑粉,反串黑".split(',');
    const idiomWords = "一心一意,三心二意,四面八方,五颜六色,七上八下,九牛一毛,十全十美,百发百中,千军万马,万紫千红,画蛇添足,守株待兔,亡羊补牢,狐假虎威,叶公好龙,掩耳盗铃,刻舟求剑,拔苗助长,坐井观天,井底之蛙,杞人忧天,愚公移山,精卫填海,夸父追日,女娲补天,开天辟地,大禹治水,后羿射日,牛郎织女,嫦娥奔月,八仙过海,各显神通,对牛弹琴,缘木求鱼,杯弓蛇影,画龙点睛,虎头蛇尾,龙飞凤舞,鸡飞狗跳,狼吞虎咽,龙争虎斗,生龙活虎,卧虎藏龙,调虎离山,骑虎难下,马到成功,指鹿为马,快马加鞭,老马识途,悬崖勒马,塞翁失马,闻鸡起舞,鹤立鸡群,鸡犬升天,鸡犬不宁,鼠目寸光,胆小如鼠,抱头鼠窜,牛鬼蛇神,九牛一毛,虎背熊腰,兔死狐悲,龙马精神,蛇鼠一窝,打草惊蛇,马不停蹄,羊肠小道,亡羊补牢,猴年马月,鸡毛蒜皮,犬牙交错,狗急跳墙,狼心狗肺,狼狈为奸,猪狗不如,鸟语花香,一箭双雕,双管齐下,两全其美,三顾茅庐,四平八稳,五体投地,六神无主,七窍生烟,八仙过海,九死一生,十面埋伏,百里挑一,千载难逢,万众一心,不计其数,成千上万,千变万化,千山万水,千言万语,千辛万苦,千锤百炼,千丝万缕,千真万确,千钧一发,千篇一律,千奇百怪,千里迢迢".split(',');
    const foodWords = "火锅,麻辣烫,串串香,关东煮,寿喜烧,部队锅,涮羊肉,烤鱼,烤串,烧烤,烤肉,铁板烧,牛排,炸鸡,炸串,炸酱面,拉面,刀削面,手擀面,阳春面,热干面,担担面,重庆小面,螺蛳粉,酸辣粉,过桥米线,桂林米粉,肠粉,河粉,煲仔饭,盖浇饭,蛋炒饭,扬州炒饭,卤肉饭,台湾卤肉饭,黄焖鸡米饭,饺子,馄饨,抄手,云吞,烧卖,包子,小笼包,灌汤包,生煎,馒头,花卷,油条,豆浆,豆腐脑,豆花,煎饼,手抓饼,葱油饼,鸡蛋灌饼,煎饼果子,肉夹馍,锅盔,烤馕,羊肉串,手抓饭,大盘鸡,椒麻鸡,辣子鸡,口水鸡,白切鸡,文昌鸡,叫花鸡,汽锅鸡,烤鸭,盐水鸭,酱鸭,卤鸭,鸭血粉丝汤,老鸭汤,鸭脖,鸭翅,鸭舌,东坡肉,红烧肉,梅菜扣肉,回锅肉,锅包肉,糖醋里脊,咕咾肉,荔枝肉,水煮肉片,水煮鱼,酸菜鱼,麻辣鱼,清蒸鱼,红烧鱼,松鼠桂鱼,西湖醋鱼,剁椒鱼头,鱼香肉丝,宫保鸡丁,夫妻肺片,麻婆豆腐,虎皮青椒,地三鲜,溜肉段,京酱肉丝,木须肉,四喜丸子,糖醋排骨".split(',');
    const animalWords = "猫咪,小猫,大猫,老虎,狮子,猎豹,雪豹,云豹,金猫,薮猫,狞猫,豹猫,虎猫,兔狲,藏獒,哈士奇,金毛,拉布拉多,泰迪,比熊,博美,柯基,柴犬,秋田,中华田园犬,边牧,德牧,罗威纳,杜宾,萨摩耶,阿拉斯加,松狮,巴哥,法斗,英斗,吉娃娃,约克夏,马尔济斯,雪纳瑞,贵宾,比格,小鹿犬,京巴,西施犬,猎狐梗,万能梗,灵缇,大丹犬,圣伯纳,大白熊,高加索,中亚牧羊犬,比特,土佐,菲勒,卡斯罗,加纳利,阿根廷杜高,美国恶霸,斯塔福,牛头梗,大麦町,斑点狗,贵妇犬,卷毛比熊,贝灵顿梗,凯利蓝梗,爱尔兰梗,苏格兰梗,西高地白梗,杰克梗,金毛寻回犬,拉布拉多寻回犬,平毛寻回犬,卷毛寻回犬,爱尔兰水猎犬,葡萄牙水犬,西班牙水犬,英国可卡犬,美国可卡犬,英国史宾格犬,威尔士史宾格犬,爱尔兰雪达犬,戈登雪达犬,英国雪达犬,指示犬,德国短毛指示犬,德国刚毛指示犬,威玛猎犬,匈牙利维兹拉犬,博美犬,哈士奇,萨摩耶,阿拉斯加雪橇犬,西伯利亚雪橇犬,格陵兰犬,加拿大爱斯基摩犬,挪威猎糜犬,瑞典猎糜犬,芬兰猎犬".split(',');

    function getWordPool() {
        if (currentTheme === 'internet') return internetWords;
        if (currentTheme === 'idiom') return idiomWords;
        if (currentTheme === 'food') return foodWords;
        if (currentTheme === 'animal') return animalWords;
        return standardWords;
    }

    function shuffleArray(arr) { for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
    function getPinyin(text) { if(typeof pinyinPro!=='undefined' && pinyinPro.pinyin) return pinyinPro.pinyin(text,{toneType:'none'}).replace(/\s+/g,''); return ''; }
    function updateScoreUI(){ scoreDisplay.textContent = score; }
    function updateMissUI(){ const left = maxMisses - missCount; missCountSpan.textContent = left; missCountSpan.style.color = left<=1?'#ff6b6b':'#fff'; }
    function updateSpeedUI(){ speedSlider.value = speedLevel; speedValue.textContent = ['1档(慢)','2档','3档','4档','5档(快)'][speedLevel-1]; }
    function updateComboDisplay() {
        if (combo >= 2) {
            comboDisplay.textContent = `🔥 COMBO x${combo}`;
            comboDisplay.classList.add('combo-active');
        } else {
            comboDisplay.classList.remove('combo-active');
        }
    }
    function resetCombo() { combo = 0; updateComboDisplay(); }

    function getWordFallSpeed() { return 0.2 + 0.7 * (speedLevel - 1); }

    function createWordElement(text) {
        const el = document.createElement('div'); el.className = 'word';
        const textSpan = document.createElement('span'); textSpan.textContent = text;
        const pinyinSpan = document.createElement('span'); pinyinSpan.className = 'pinyin';
        pinyinSpan.textContent = getPinyin(text);
        el.appendChild(textSpan); el.appendChild(pinyinSpan);
        el.style.left = Math.random() * (DESIGN_WIDTH - 200) + 'px';
        el.style.top = '-60px';
        gameContainer.appendChild(el);
        return el;
    }
    function spawnWord() {
        if (isPaused||isGameOver||!gameStarted) return;
        if (remainingPhrases.length === 0) remainingPhrases = shuffleArray(getWordPool());
        const phrase = remainingPhrases.pop();
        const el = createWordElement(phrase);
        const fallSpeed = getWordFallSpeed();
        activeWords.push({ element: el, x: parseFloat(el.style.left), y: -60, speed: fallSpeed });
        updateActiveHighlight();
    }
    function removeWordAtIndex(index) {
        const word = activeWords[index]; if(!word) return;
        word.element.classList.add('exploding');
        word.element.addEventListener('animationend', function h(){
            word.element.removeEventListener('animationend', h);
            if(word.element.parentNode) gameContainer.removeChild(word.element);
        });
        const popup = document.createElement('div'); popup.className = 'score-popup';
        const points = 10 + (combo>=2 ? combo*2 : 0);
        popup.textContent = `+${points}`;
        const rect = word.element.getBoundingClientRect();
        const containerRect = gameContainer.getBoundingClientRect();
        popup.style.left = (rect.left - containerRect.left) + 'px';
        popup.style.top = (rect.top - containerRect.top) + 'px';
        gameContainer.appendChild(popup);
        popup.addEventListener('animationend', ()=>popup.remove());
        activeWords.splice(index,1);
        if(combo>=2) playTone(600 + combo*50, 'sine', 0.15, 0.3);
        else playTone(500, 'sine', 0.1, 0.3);
    }
    function clearAllWords(){
        activeWords.forEach(w=>{ if(w.element&&w.element.parentNode) w.element.remove(); });
        activeWords = [];
    }
    function updateActiveHighlight(){
        activeWords.forEach((w,i)=> w.element.classList.toggle('active', i===0 && activeWords.length>0));
    }
    function checkAndSpawnIfEmpty(){
        if(!isPaused && !isGameOver && gameStarted && activeWords.length===0) spawnWord();
    }
    function stopGameLoop(){ if(animationId){ cancelAnimationFrame(animationId); animationId=null; } }
    function gameLoop(){
        if(isPaused||isGameOver||!gameStarted){ animationId=requestAnimationFrame(gameLoop); return; }
        for(let i=activeWords.length-1;i>=0;i--){
            const w = activeWords[i];
            w.y += w.speed;
            w.element.style.top = w.y + 'px';
            if(w.y > DESIGN_HEIGHT){
                missCount++; updateMissUI();
                w.element.remove(); activeWords.splice(i,1);
                resetCombo();
                playTone(200, 'triangle', 0.2, 0.2);
                if(missCount >= maxMisses){ endGame(); return; }
                updateActiveHighlight();
            }
        }
        checkAndSpawnIfEmpty();
        animationId = requestAnimationFrame(gameLoop);
    }

    function resetGameState() {
        stopGameLoop(); clearAllWords();
        inputBox.value = ''; score=0; missCount=0; combo=0;
        updateScoreUI(); updateMissUI(); updateComboDisplay();
        isGameOver=false; isPaused=false;
        pauseOverlay.classList.remove('visible');
        gameOverMsg.classList.remove('show');
        inputBox.disabled = false;
    }

    function applyModeSettings() {
        if (currentMode === 'endless') {
            speedLevel = 1;
            maxMisses = 5;
            missCount = 0;
            endlessLevelUpFlags = {2:false,3:false,4:false,5:false};
            difficultyGroup.style.display = 'none';
            speedSlider.disabled = true;
            difficultySelect.disabled = true;
            modeSelect.disabled = true;
        } else {
            difficultyGroup.style.display = 'flex';
            speedSlider.disabled = false;
            difficultySelect.disabled = false;
            modeSelect.disabled = false;
        }
        updateSpeedUI();
        updateMissUI();
    }

    function resetGame() {
        if (!currentProfile) { alert('请先创建或选择一个角色！'); showProfileModal(); return; }
        inputBox.disabled = false;
        resetGameState();
        gameStarted = true;
        currentMode = modeSelect.value;
        currentTheme = themeSelect.value;
        if (currentMode === 'normal') {
            currentDifficulty = difficultySelect.value;
            if (currentDifficulty === 'easy') { speedLevel = 2; maxMisses = 5; }
            else if (currentDifficulty === 'medium') { speedLevel = 3; maxMisses = 3; }
            else { speedLevel = 4; maxMisses = 2; }
        }
        applyModeSettings();
        remainingPhrases = shuffleArray(getWordPool());
        updateMissUI();
        spawnWord();
        animationId = requestAnimationFrame(gameLoop);
        inputBox.focus();
    }

    function startNewGame() {
        if (appData.profiles.length === 0) { alert('请先创建一个角色！'); showProfileModal(); return; }
        inputBox.disabled = false;
        startOverlay.classList.add('hidden');
        resetGame();
    }

    function endGame(saveProgress = true){
        if(isGameOver) return;
        isGameOver=true; stopGameLoop(); clearAllWords();
        finalScoreSpan.textContent = score;
        gameOverMsg.classList.add('show');
        inputBox.blur(); gameStarted=false;
        inputBox.disabled = true;
        if (saveProgress) saveDailyProgress(score, 0);
        if (currentMode === 'endless') {
            modeSelect.disabled = false;
        }
    }

    function togglePause(){
        if(isGameOver||!gameStarted) return;
        isPaused=!isPaused;
        if(isPaused){
            pauseOverlay.classList.add('visible');
            inputBox.blur();
            inputBox.disabled = true;
        } else {
            pauseOverlay.classList.remove('visible');
            inputBox.disabled = false;
            checkAndSpawnIfEmpty();
            inputBox.focus();
        }
        updateActiveHighlight();
    }

    // 无尽模式升级检查
    function checkEndlessLevelUp() {
        if (currentMode !== 'endless') return;
        if (combo >= 10 && !endlessLevelUpFlags[2] && speedLevel < 2) {
            speedLevel = 2;
            endlessLevelUpFlags[2] = true;
            maxMisses += 1;
            missCount = Math.min(missCount, maxMisses);
        }
        if (combo >= 20 && speedLevel === 2 && !endlessLevelUpFlags[3]) {
            speedLevel = 3;
            endlessLevelUpFlags[3] = true;
            maxMisses += 1;
        }
        if (combo >= 10 && speedLevel === 3 && !endlessLevelUpFlags[4]) {
            speedLevel = 4;
            endlessLevelUpFlags[4] = true;
            maxMisses += 1;
        }
        if (combo >= 10 && speedLevel === 4 && !endlessLevelUpFlags[5]) {
            speedLevel = 5;
            endlessLevelUpFlags[5] = true;
            maxMisses += 1;
        }
        updateSpeedUI();
        updateMissUI();
    }

    inputBox.addEventListener('input', ()=>{
        if(isPaused||isGameOver||!gameStarted||activeWords.length===0){ if(inputBox.value!=='')inputBox.value=''; return; }
        const current = activeWords[0];
        const target = current.element.querySelector('span:first-child').textContent;
        const val = inputBox.value;
        if(target.startsWith(val)){
            if(val === target){
                combo++; updateComboDisplay();
                const points = 10 + (combo>=2 ? combo*2 : 0);
                score += points; updateScoreUI();
                removeWordAtIndex(0);
                inputBox.value = ''; updateActiveHighlight();
                checkEndlessLevelUp();
                checkAndSpawnIfEmpty();
            }
        } else {
            recordMistake(target); inputBox.value = ''; resetCombo();
            playTone(200, 'triangle', 0.15, 0.2);
        }
    });

    function scaleGame() {
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;
        const scaleX = windowWidth / DESIGN_WIDTH;
        const scaleY = windowHeight / DESIGN_HEIGHT;
        const scale = Math.min(scaleX, scaleY);
        gameContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
        gameContainer.style.position = 'absolute';
        gameContainer.style.left = '50%';
        gameContainer.style.top = '50%';
    }
    window.addEventListener('resize', scaleGame);
    window.addEventListener('load', scaleGame);
    scaleGame();

    startBtn.addEventListener('click', ()=>{ initAudio(); startNewGame(); });
    pauseBtn.addEventListener('click', (e)=>{ e.stopPropagation(); togglePause(); });
    newGameBtn.addEventListener('click', (e)=>{ e.stopPropagation(); resetGame(); });
    restartBtn.addEventListener('click', (e)=>{ e.stopPropagation(); resetGame(); });
    speedSlider.addEventListener('input', (e)=>{ if (currentMode === 'endless') return; speedLevel=parseInt(e.target.value); updateSpeedUI(); });
    modeSelect.addEventListener('change', (e) => {
        if (gameStarted) return;
        currentMode = e.target.value;
        if (currentMode === 'endless') { difficultyGroup.style.display = 'none'; }
        else { difficultyGroup.style.display = 'flex'; }
    });
    difficultySelect.addEventListener('change', (e) => { currentDifficulty = e.target.value; });
    themeSelect.addEventListener('change', (e) => { currentTheme = e.target.value; });

    gameContainer.addEventListener('click', (e)=>{
        if ((e.target === gameContainer || e.target === pauseOverlay) && !isPaused && !isGameOver && gameStarted) {
            inputBox.focus();
        }
    });
    document.addEventListener('keydown', (e)=>{
        if(e.key==='Escape'){ e.preventDefault(); if(!isGameOver&&gameStarted) togglePause(); }
        if(e.key==='Enter'&&isGameOver&&gameOverMsg.classList.contains('show')){ e.preventDefault(); restartBtn.click(); }
    });
    pauseOverlay.addEventListener('click', (e)=>{ if(isPaused && !isGameOver) togglePause(); });
    historyBtn.addEventListener('click', (e)=>{ e.stopPropagation(); mistakePanel.classList.toggle('visible'); if(mistakePanel.classList.contains('visible')) renderMistakePanel(); });
    progressBtn.addEventListener('click', (e)=>{ e.stopPropagation(); progressPanel.classList.toggle('visible'); if(progressPanel.classList.contains('visible')) drawProgressChart(); });
    document.addEventListener('click', (e)=>{
        if(!mistakePanel.contains(e.target)&&e.target!==historyBtn) mistakePanel.classList.remove('visible');
        if(!progressPanel.contains(e.target)&&e.target!==progressBtn) progressPanel.classList.remove('visible');
        if(!profileModal.contains(e.target) && e.target !== titleEl) hideProfileModal();
    });
    profileModal.addEventListener('click', (e)=>{ e.stopPropagation(); });

    if('serviceWorker' in navigator){
        navigator.serviceWorker.register("data:application/javascript," + encodeURIComponent("self.addEventListener('fetch',e=>{})"));
    }

    function init(){
        speedLevel = 3; maxMisses = 3;
        updateSpeedUI(); updateMissUI();
        gameStarted = false; startOverlay.classList.remove('hidden');
        inputBox.disabled = true;
        updateRoleLabel();
        if (appData.profiles.length === 0) {
            const defaultProfile = { id: generateId(), name: '打字新手', createdAt: new Date().toISOString(), mistakeHistory: {}, progressData: {} };
            appData.profiles.push(defaultProfile);
            appData.currentProfileId = defaultProfile.id;
            currentProfile = defaultProfile;
            saveAllProfiles(appData);
            updateRoleLabel();
        }
    }
    init();
})();
</script>

<div id="gameContainer">
    <div id="startOverlay">
        <div style="font-size:2.5rem; font-weight:bold; color:var(--accent);">⌨️ 打字gogogo</div>
        <button id="startBtn">开始游戏</button>
    </div>
    <div id="topBar">
        <h1 id="title" title="点击管理角色">⌨️ 打字gogogo ✎</h1>
        <div id="scoreBoard">
            <span>🌟 得分 <span id="scoreDisplay">0</span></span>
            <span id="currentRole">角色：<span id="roleLabel">---</span></span>
        </div>
        <div class="setting-group">
            <label>🎯 模式</label>
            <select id="modeSelect">
                <option value="normal" selected>普通</option>
                <option value="endless">无尽</option>
            </select>
        </div>
        <div class="setting-group" id="difficultyGroup">
            <label>📊 难度</label>
            <select id="difficultySelect">
                <option value="easy">初级</option>
                <option value="medium" selected>中级</option>
                <option value="hard">高级</option>
            </select>
        </div>
        <div class="setting-group">
            <label>📚 词库</label>
            <select id="themeSelect">
                <option value="standard" selected>标准</option>
                <option value="internet">热梗</option>
                <option value="idiom">成语</option>
                <option value="food">美食</option>
                <option value="animal">动物</option>
            </select>
        </div>
        <div class="setting-group">
            <label>🎨 配色</label>
            <select id="colorSelect">
                <option value="green">暗夜松绿</option>
                <option value="coffee">暖暮咖啡</option>
                <option value="ocean">深海蓝灰</option>
                <option value="purple">淡雅紫灰</option>
                <option value="light">白底黑字</option>
            </select>
        </div>
        <div id="speedPanel">
            <span>🐢</span>
            <input type="range" id="speedSlider" min="1" max="5" value="3" step="1">
            <span>🐇</span>
            <span id="speedValue">3档</span>
        </div>
        <div id="controlBtns">
            <button class="btn" id="pauseBtn" title="暂停 (ESC)">⏯️ 暂停</button>
            <button class="btn" id="newGameBtn">🔄 新游戏</button>
        </div>
    </div>
    <div id="profileModal">
        <div class="profile-panel">
            <h3 style="margin:0; text-align:center;">🎭 角色管理</h3>
            <div class="profile-list" id="profileList"></div>
            <button class="btn new-profile-btn" id="addProfileBtn">➕ 新建角色</button>
            <input type="text" id="newProfileName" placeholder="输入角色名 (2-8字)" maxlength="8">
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="btn" id="confirmAddBtn" style="display:none;">确认创建</button>
                <button class="btn" id="cancelAddBtn" style="display:none;">取消</button>
            </div>
            <button class="btn" id="closeProfileBtn" style="margin-top:5px;">关闭</button>
        </div>
    </div>
    <div id="comboDisplay">COMBO x1</div>
    <input type="text" id="inputBox" placeholder="在此输入汉字..." autocomplete="off">
    <div id="missDisplay">💔 剩余机会 <span id="missCount">3</span></div>
    <button id="historyBtn">📖 错词</button>
    <button id="progressBtn">📈 进步</button>
    <div id="mistakePanel"></div>
    <div id="progressPanel"><canvas id="progressCanvas" width="180" height="120"></canvas></div>
    <div id="pauseOverlay">⏸️ 暂停中</div>
    <div id="gameOverMsg">
        <div>💥 游戏结束</div>
        <div style="font-size:1.1rem; margin-top:10px;">最终得分：<span id="finalScore">0</span></div>
        <button class="btn" id="restartBtn" style="margin-top:15px;">🔄 再来一局</button>
    </div>
</div>
