    <style>
        /* 样式与之前完全一致，此处省略但保留完整 */
        :root {

            --accent: #e94560;
            --word-color: #f1f1f1;
            --word-active: #e94560;
            --ui-bg: rgba(0,0,0,0.3);

        }
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; color: white; user-select: none; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #gameContainer { width: var(--design-width); height: var(--design-height); position: relative; background: var(--container-bg); transform-origin: center center; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 10px; overflow: hidden; }
        #startOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 100; flex-direction: column; gap: 30px; }
        #startOverlay.hidden { display: none; }
        #startBtn { font-size: 2rem; padding: 20px 60px; border-radius: 50px; background: var(--accent); border: none; color: white; cursor: pointer; letter-spacing: 4px; font-weight: bold; box-shadow: 0 0 30px rgba(233,69,96,0.8); transition: transform 0.2s, box-shadow 0.2s; }
        #startBtn:hover { transform: scale(1.08); box-shadow: 0 0 50px rgba(233,69,96,1); }
        #topBar { position: absolute; top: 10px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; z-index: 60; }
        #title { font-size: 1.4rem; font-weight: bold; color: var(--accent); text-shadow: 2px 2px 8px rgba(0,0,0,0.7); margin: 0; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        #currentRole { font-size: 0.7rem; opacity: 0.8; }

        .setting-group label { opacity: 0.8; }
        .setting-group select { background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 3px 5px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; outline: none; }
        #speedPanel { display: flex; align-items: center; gap: 6px; background: var(--ui-bg); padding: 4px 10px; border-radius: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); font-size: 0.75rem; }

        #profileModal.show { display: flex; }

        #historyBtn, #progressBtn { position: absolute; right: 10px; z-index: 65; writing-mode: vertical-lr; letter-spacing: 3px; background: var(--accent); border: none; color: white; padding: 10px 5px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; box-shadow: 0 0 10px rgba(233,69,96,0.5); }
        #historyBtn { top: 30%; transform: translateY(-50%); }

        #pauseOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; z-index: 50; font-size: 2.5rem; font-weight: bold; letter-spacing: 6px; color: white; text-shadow: 0 0 25px var(--accent); cursor: pointer; }
        #pauseOverlay.visible { display: flex; }
        #gameOverMsg { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); padding: 25px 40px; border-radius: 20px; text-align: center; font-size: 1.3rem; backdrop-filter: blur(10px); border: 2px solid var(--accent); display: none; z-index: 60; animation: fadeIn 0.4s; }
        #gameOverMsg.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -40px); } to { opacity: 1; transform: translate(-50%, -50%); } }
        #comboDisplay { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px #ffaa00; z-index: 40; transition: opacity 0.2s; opacity: 0; pointer-events: none; }
        #comboDisplay.active { opacity: 1; }
        #inputBox { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 10px 20px; font-size: 1.1rem; border: 2px solid var(--accent); border-radius: 20px; background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); color: white; text-align: center; outline: none; z-index: 30; width: 220px; letter-spacing: 2px; transition: all 0.3s; }
        #inputBox:focus { box-shadow: 0 0 20px rgba(233,69,96,0.7); background: rgba(255,255,255,0.18); }

        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 50% { opacity: 1; transform: translateY(-30px) scale(1.3); } 100% { opacity: 0; transform: translateY(-70px) scale(1); } }

<script>
    (function() {
        // ========== 音效系统 ==========
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
        function playTone(freq, type='sine', duration=0.1, vol=0.3) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const DESIGN_WIDTH = 900;
        const DESIGN_HEIGHT = 600;

        // ========== 数据管理 ==========
        const STORAGE_KEY = 'typingGameProfiles';
        function loadAllProfiles() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) return JSON.parse(raw);
            const oldMistake = JSON.parse(localStorage.getItem('mistakeHistory') || '{}');
            const oldProgress = JSON.parse(localStorage.getItem('typingProgress') || '{}');
            const defaultProfile = {
                id: generateId(),
                name: '打字新手',
                createdAt: new Date().toISOString(),
                mistakeHistory: oldMistake,
                progressData: oldProgress
            };
            return {
                currentProfileId: defaultProfile.id,
                profiles: [defaultProfile]
            };
        }
        function saveAllProfiles(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

        let appData = loadAllProfiles();
        let currentProfile = appData.profiles.find(p => p.id === appData.currentProfileId) || appData.profiles[0];

        function getCurrentProfile() { return currentProfile; }
        function updateCurrentProfileId(id) {
            appData.currentProfileId = id;
            currentProfile = appData.profiles.find(p => p.id === id);
            saveAllProfiles(appData);
        }

        function recordMistake(word) {
            if (!word) return;
            const p = getCurrentProfile();
            p.mistakeHistory[word] = (p.mistakeHistory[word] || 0) + 1;
            saveAllProfiles(appData);
            renderMistakePanel();
        }
        function saveDailyProgress(scoreVal, totalChars) {
            const today = new Date().toISOString().slice(0,10);
            const p = getCurrentProfile();
            if (!p.progressData[today]) p.progressData[today] = { scores: [], totalChars: 0 };
            p.progressData[today].scores.push(scoreVal);
            p.progressData[today].totalChars += totalChars;
            saveAllProfiles(appData);
        }
        function drawProgressChart() {
            const ctx = progressCanvas.getContext('2d');
            const p = getCurrentProfile();
            const data = p.progressData;
            const days = Object.keys(data).sort().slice(-7);
            ctx.clearRect(0,0,progressCanvas.width,progressCanvas.height);
            if(days.length===0){ ctx.fillStyle='#aaa'; ctx.fillText('暂无数据',30,60); return; }
            const maxScore = Math.max(...days.map(d=>Math.max(...data[d].scores)), 10);
            const barW = 14, gap = (180 - days.length*barW)/(days.length+1);
            ctx.fillStyle = '#ffa500'; ctx.font = '9px sans-serif';
            days.forEach((d,i)=>{
                const x = gap + i*(barW+gap);
                const best = Math.max(...data[d].scores);
                const h = (best/maxScore)*80;
                ctx.fillRect(x, 90-h, barW, h);
                ctx.fillStyle = '#fff';
                ctx.fillText(d.slice(5), x, 105);
                ctx.fillStyle = '#ffa500';
            });
        }

        // ========== 角色 UI ==========
        function renderProfiles() { /* 与之前相同 */ }
        function updateRoleLabel() { roleLabel.textContent = currentProfile.name; }
        function showProfileModal() { renderProfiles(); profileModal.classList.add('show'); }

        // 词库获取逻辑
        function getWordPool() {
            let pool = [];
            // 基础词库按难度
            if (currentDifficulty === 'easy') {
                pool = easyBase.slice();
            } else if (currentDifficulty === 'medium') {
                pool = standardWords.slice();
            } else { // 高级：混合标准与主题词
                pool = [...standardWords];
            }

            // 主题词库替换/覆盖
            if (currentTheme === 'internet') pool = [...internetWords, ...standardWords.slice(0, 50)];
            else if (currentTheme === 'idiom') pool = [...idiomWords, ...standardWords.slice(0, 50)];
            else if (currentTheme === 'food') pool = [...foodWords, ...standardWords.slice(0, 50)];
            else if (currentTheme === 'animal') pool = [...animalWords, ...standardWords.slice(0, 50)];

            return [...new Set(pool)]; // 去重
        }

        function init(){
            speedLevel=2; updateSpeedUI(); updateMissUI();
            gameStarted=false; startOverlay.classList.remove('hidden');
            inputBox.disabled = true;
            updateRoleLabel();
            if (appData.profiles.length === 0) {
                const defaultProfile = {
                    id: generateId(),
                    name: '打字新手',
                    createdAt: new Date().toISOString(),
                    mistakeHistory: {},
                    progressData: {}
                };
                appData.profiles.push(defaultProfile);
                appData.currentProfileId = defaultProfile.id;
                currentProfile = defaultProfile;
                saveAllProfiles(appData);
                updateRoleLabel();
            }
        }
        init();
