<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>打字gogogo · 最终版</title>
    <script src="https://unpkg.com/pinyin-pro@3.20.4/dist/index.js"></script>
    <style>
        :root {
            --bg: #1a2421; --container-bg: radial-gradient(circle at center, #162e22, #0b4229); --accent: #2ecc71;
            --word-color: #f1f1f1; --word-active: #2ecc71; --ui-bg: rgba(0,0,0,0.3);
            --btn-bg: rgba(255,255,255,0.15); --btn-hover: rgba(46,204,113,0.4); --text-color: white;
            --input-bg: rgba(255,255,255,0.12); --pinyin-color: rgba(200,255,220,0.7);
            --design-width: 1280px; --design-height: 800px;
        }
        *{box-sizing:border-box} body{margin:0;overflow:hidden;background:var(--bg);font-family:'Microsoft YaHei',sans-serif;color:var(--text-color);user-select:none;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center}
        #gameContainer{width:var(--design-width);height:var(--design-height);position:relative;background:var(--container-bg);transform-origin:center center;box-shadow:0 0 50px rgba(0,0,0,0.8);border-radius:10px;overflow:hidden}
        #startOverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:100;flex-direction:column;gap:30px}
        #startOverlay.hidden{display:none}
        #startBtn{font-size:2rem;padding:20px 60px;border-radius:50px;background:var(--accent);border:none;color:white;cursor:pointer;font-weight:bold;box-shadow:0 0 30px rgba(0,0,0,0.5);transition:transform 0.2s}
        #startBtn:hover{transform:scale(1.08)}
        #topBar{position:absolute;top:10px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;z-index:60}
        #title{font-size:1.4rem;font-weight:bold;color:var(--accent);text-shadow:2px 2px 8px rgba(0,0,0,0.7);margin:0;cursor:pointer;display:flex;align-items:center;gap:5px}
        #scoreBoard{font-size:0.85rem;background:var(--ui-bg);padding:4px 10px;border-radius:12px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;gap:8px}
        .setting-group{display:flex;flex-direction:column;gap:2px;background:var(--ui-bg);padding:4px 8px;border-radius:12px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);font-size:0.7rem}
        .setting-group label{opacity:0.8} .setting-group select{background:rgba(0,0,0,0.6);color:var(--text-color);border:1px solid rgba(255,255,255,0.3);padding:3px 5px;border-radius:8px;cursor:pointer;font-size:0.75rem}
        #speedPanel{display:flex;align-items:center;gap:6px;background:var(--ui-bg);padding:4px 10px;border-radius:15px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);font-size:0.75rem}
        #speedSlider{width:70px;accent-color:var(--accent);cursor:pointer}
        #speedValue{min-width:30px;text-align:center;font-weight:bold;color:var(--accent)}
        #controlBtns{display:flex;gap:6px}
        .btn{background:var(--btn-bg);border:1px solid rgba(255,255,255,0.25);color:var(--text-color);padding:5px 12px;border-radius:15px;font-size:0.75rem;cursor:pointer;backdrop-filter:blur(8px);transition:all 0.2s;white-space:nowrap}
        .btn:hover{background:var(--btn-hover);border-color:var(--accent)}
        #profileModal{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);display:none;justify-content:center;align-items:center;z-index:200}
        #profileModal.show{display:flex}
        .profile-panel{background:rgba(20,20,50,0.95);border:2px solid var(--accent);border-radius:20px;padding:20px;width:350px;max-height:450px;display:flex;flex-direction:column;gap:15px;color:white}
        .profile-list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:250px}
        .profile-card{background:rgba(255,255,255,0.08);padding:10px 15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid transparent;cursor:pointer}
        .profile-card.active{border-color:var(--accent);background:rgba(46,204,113,0.3)}
        .profile-actions button{background:transparent;border:1px solid rgba(255,255,255,0.3);color:white;border-radius:8px;padding:2px 8px;font-size:0.7rem;cursor:pointer}
        #historyBtn,#progressBtn{position:absolute;right:10px;z-index:65;writing-mode:vertical-lr;letter-spacing:3px;background:var(--accent);border:none;color:white;padding:10px 5px;border-radius:12px;font-size:0.8rem;cursor:pointer}
        #historyBtn{top:30%;transform:translateY(-50%)} #progressBtn{top:50%;transform:translateY(-50%);background:#ffa500}
        #pauseOverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);display:none;justify-content:center;align-items:center;z-index:50;flex-direction:column;gap:20px;font-size:2.5rem;font-weight:bold;color:white;text-shadow:0 0 25px var(--accent);cursor:pointer}
        #pauseOverlay.visible{display:flex}
        #endGameBtn{font-size:1.2rem;padding:10px 25px;border-radius:20px;background:#ff4444;color:white;border:none;cursor:pointer;font-weight:bold;margin-top:10px;}
        #gameOverMsg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:25px 40px;border-radius:20px;text-align:center;font-size:1.3rem;backdrop-filter:blur(10px);border:2px solid var(--accent);color:white;display:none;z-index:60;animation:fadeIn 0.4s}
        #gameOverMsg.show{display:block} @keyframes fadeIn{from{opacity:0;transform:translate(-50%,-40px)}to{opacity:1;transform:translate(-50%,-50%)}}
        #comboDisplay{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:2rem;font-weight:bold;color:#ffd700;text-shadow:0 0 20px #ffaa00,0 0 40px #ff6600;z-index:40;transition:opacity 0.15s;opacity:0;pointer-events:none;white-space:nowrap}
        .combo-active{opacity:1!important}
        #inputBox{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 20px;font-size:1.1rem;border:2px solid var(--accent);border-radius:20px;background:var(--input-bg);backdrop-filter:blur(10px);color:var(--text-color);text-align:center;outline:none;z-index:30;width:260px;letter-spacing:2px;transition:border-color 0.3s}
        #inputBox:focus{box-shadow:0 0 20px var(--accent)} #missDisplay{position:absolute;bottom:40px;right:15px;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);padding:5px 12px;border-radius:12px;font-size:0.9rem;border:1px solid rgba(255,255,255,0.3);z-index:30}
        #mistakePanel,#progressPanel{position:absolute;right:55px;top:8%;width:220px;max-height:68%;background:rgba(20,20,40,0.95);border:2px solid var(--accent);border-radius:15px;padding:10px;z-index:60;overflow-y:auto;display:none;flex-direction:column;gap:8px}
        #progressPanel{border-color:#ffa500} .visible{display:flex!important}
        .mistake-item{display:flex;flex-direction:column;position:relative;background:rgba(255,255,255,0.08);padding:5px 8px;border-radius:8px}
        .mistake-word{font-size:1rem;font-weight:bold;color:#ffcccb} .mistake-badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:white;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:0.65rem}
        .word{position:absolute;font-size:2.4rem;font-weight:bold;color:var(--word-color);text-shadow:0 2px 6px black;pointer-events:none;transition:color 0.15s,transform 0.1s;white-space:nowrap;display:flex;flex-direction:column;align-items:center}
        .word .pinyin{font-size:1.05rem;color:var(--pinyin-color);text-shadow:0 1px 2px black;margin-top:2px}
        .word.active{color:var(--word-active);transform:scale(1.05);animation:pulse 0.8s infinite}
        @keyframes pulse{0%{text-shadow:0 0 10px var(--accent)}50%{text-shadow:0 0 20px var(--accent)}100%{text-shadow:0 0 10px var(--accent)}}
        .word.exploding{animation:explodeWord 0.4s ease-out forwards!important} @keyframes explodeWord{0%{color:#00ff88;transform:scale(1.5);opacity:1}100%{opacity:0}}
        .score-popup{position:absolute;font-size:2.2rem;font-weight:bold;color:#ffd700;z-index:80;animation:floatUp 0.8s ease-out forwards} @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(0.5)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
        body.light-mode .word, body.light-mode .word.active, body.light-mode .word .pinyin { text-shadow: none !important; }
        body.light-mode .word { color: #cc0000 !important; } body.light-mode .word.active { color: #cc0000 !important; }
        body.light-mode .word .pinyin { color: rgba(0,0,0,0.55) !important; }
        body.light-mode .setting-group select { background: #333 !important; color: white !important; }
        body.light-mode #title { color: #cc0000 !important; }
        body.light-mode #comboDisplay { text-shadow: none !important; }
        #restartBtn { background: #ff6b6b !important; color: white !important; font-weight: bold; padding: 8px 20px; font-size: 1rem; }
    </style>
</head>
<body>
<div id="gameContainer">
    <div id="startOverlay"><div style="font-size:2.5rem;font-weight:bold;color:var(--accent)">⌨️ 打字gogogo</div><button id="startBtn">开始游戏</button></div>
    <div id="topBar">
        <h1 id="title">⌨️ 打字gogogo ✎</h1>
        <div id="scoreBoard"><span>🌟 得分 <span id="scoreDisplay">0</span></span><span>角色：<span id="roleLabel">---</span></span></div>
        <div class="setting-group" id="modeGroup"><label>🎯 模式</label><select id="modeSelect"><option value="normal" selected>普通</option><option value="endless">无尽</option></select></div>
        <div class="setting-group" id="difficultyGroup"><label>📊 难度</label><select id="difficultySelect"><option value="easy">初级</option><option value="medium" selected>中级</option><option value="hard">高级</option></select></div>
        <div class="setting-group" id="themeGroup"><label>📚 词库</label><select id="themeSelect"><option value="standard" selected>标准</option><option value="internet">热梗</option><option value="idiom">成语</option><option value="food">美食</option><option value="animal">动物</option></select></div>
        <div class="setting-group" id="colorGroup"><label>🎨 配色</label><select id="colorSelect"><option value="green">暗夜松绿</option><option value="coffee">暖暮咖啡</option><option value="ocean">深海蓝灰</option><option value="purple">淡雅紫灰</option><option value="light">白底黑字</option></select></div>
        <div id="speedPanel"><span>🐢</span><input type="range" id="speedSlider" min="1" max="5" value="3" step="1"><span>🐇</span><span id="speedValue">3档</span></div>
        <div id="controlBtns"><button class="btn" id="pauseBtn">⏯️ 暂停</button><button class="btn" id="newGameBtn">🔄 新游戏</button></div>
    </div>
    <div id="profileModal"><div class="profile-panel"><h3 style="margin:0;text-align:center">🎭 角色管理</h3><div class="profile-list" id="profileList"></div><button class="btn" id="addProfileBtn" style="align-self:center">➕ 新建角色</button><input type="text" id="newProfileName" placeholder="角色名(2-8字)" maxlength="8" style="display:none;background:rgba(0,0,0,0.6);color:white;border:1px solid rgba(255,255,255,0.3);padding:6px 10px;border-radius:8px;width:100%"><div style="display:flex;gap:10px;justify-content:center"><button class="btn" id="confirmAddBtn" style="display:none">确认</button><button class="btn" id="cancelAddBtn" style="display:none">取消</button></div><button class="btn" id="closeProfileBtn" style="margin-top:5px">关闭</button></div></div>
    <div id="comboDisplay">COMBO x1</div>
    <input type="text" id="inputBox" placeholder="点击开始游戏后输入..." autocomplete="off">
    <div id="missDisplay">💔 剩余机会 <span id="missCount">3</span></div>
    <button id="historyBtn">📖 错词</button><button id="progressBtn">📈 进步</button>
    <div id="mistakePanel"></div><div id="progressPanel"><canvas id="progressCanvas" width="180" height="120"></canvas></div>
    <div id="pauseOverlay">
        <span>⏸️ 暂停中</span>
        <button id="endGameBtn">结束本局游戏</button>
    </div>
    <div id="gameOverMsg"><div>💥 游戏结束</div><div style="font-size:1.1rem;margin-top:10px">最终得分：<span id="finalScore">0</span></div><div style="font-size:1rem;margin-top:5px" id="speedStat"></div><button class="btn" id="restartBtn" style="margin-top:15px">🔄 再来一局</button></div>
</div>
<script>
(function(){
    const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx;
    function initAudio(){if(!audioCtx)audioCtx=new AudioCtx}
    function playTone(freq,type='sine',dur=0.1,vol=0.3){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}

    const G=document.getElementById('gameContainer'),I=document.getElementById('inputBox'),
          SD=document.getElementById('scoreDisplay'),SL=document.getElementById('speedSlider'),SV=document.getElementById('speedValue'),
          PB=document.getElementById('pauseBtn'),NB=document.getElementById('newGameBtn'),PO=document.getElementById('pauseOverlay'),
          GO=document.getElementById('gameOverMsg'),FS=document.getElementById('finalScore'),RB=document.getElementById('restartBtn'),
          MC=document.getElementById('missCount'),SO=document.getElementById('startOverlay'),SB=document.getElementById('startBtn'),
          HB=document.getElementById('historyBtn'),MP=document.getElementById('mistakePanel'),PB2=document.getElementById('progressBtn'),
          PP=document.getElementById('progressPanel'),PC=document.getElementById('progressCanvas'),CD=document.getElementById('comboDisplay'),
          MS=document.getElementById('modeSelect'),DS=document.getElementById('difficultySelect'),DG=document.getElementById('difficultyGroup'),
          TS=document.getElementById('themeSelect'),CS=document.getElementById('colorSelect'),TE=document.getElementById('title'),
          RL=document.getElementById('roleLabel'),PM=document.getElementById('profileModal'),PL=document.getElementById('profileList'),
          AP=document.getElementById('addProfileBtn'),NP=document.getElementById('newProfileName'),CA=document.getElementById('confirmAddBtn'),
          CL=document.getElementById('cancelAddBtn'),CP=document.getElementById('closeProfileBtn'),
          SS=document.getElementById('speedStat'),EB=document.getElementById('endGameBtn');
    const DW=1280,DH=800;
    const colorSchemes={
        green:{bg:'#1a2421',cbg:'radial-gradient(circle at center, #162e22, #0b4229)',a:'#2ecc71',w:'#f1f1f1',wa:'#2ecc71',uibg:'rgba(0,0,0,0.3)',bbg:'rgba(255,255,255,0.15)',bh:'rgba(46,204,113,0.4)',t:'white',ibg:'rgba(255,255,255,0.12)',py:'rgba(200,255,220,0.7)'},
        coffee:{bg:'#2c2416',cbg:'radial-gradient(circle at center, #3e2e1a, #1f1500)',a:'#e67e22',w:'#f5f0e6',wa:'#e67e22',uibg:'rgba(0,0,0,0.3)',bbg:'rgba(255,255,255,0.15)',bh:'rgba(230,126,34,0.4)',t:'white',ibg:'rgba(255,255,255,0.12)',py:'rgba(255,220,180,0.7)'},
        ocean:{bg:'#1b2a3a',cbg:'radial-gradient(circle at center, #1e3448, #0f1a26)',a:'#5dade2',w:'#f1f1f1',wa:'#5dade2',uibg:'rgba(0,0,0,0.3)',bbg:'rgba(255,255,255,0.15)',bh:'rgba(93,173,226,0.4)',t:'white',ibg:'rgba(255,255,255,0.12)',py:'rgba(180,220,255,0.7)'},
        purple:{bg:'#282234',cbg:'radial-gradient(circle at center, #362a48, #1b1326)',a:'#bb8fce',w:'#f1f1f1',wa:'#bb8fce',uibg:'rgba(0,0,0,0.3)',bbg:'rgba(255,255,255,0.15)',bh:'rgba(187,143,206,0.4)',t:'white',ibg:'rgba(255,255,255,0.12)',py:'rgba(220,200,240,0.7)'},
        light:{bg:'#f5f5f5',cbg:'#ffffff',a:'#333333',w:'#cc0000',wa:'#cc0000',uibg:'rgba(0,0,0,0.05)',bbg:'rgba(0,0,0,0.08)',bh:'rgba(0,0,0,0.15)',t:'#222222',ibg:'rgba(0,0,0,0.05)',py:'rgba(0,0,0,0.6)'}
    };
    function applyColor(name){
        const s=colorSchemes[name],r=document.documentElement.style;
        r.setProperty('--bg',s.bg);r.setProperty('--container-bg',s.cbg);r.setProperty('--accent',s.a);
        r.setProperty('--word-color',s.w);r.setProperty('--word-active',s.wa);r.setProperty('--ui-bg',s.uibg);
        r.setProperty('--btn-bg',s.bbg);r.setProperty('--btn-hover',s.bh);r.setProperty('--text-color',s.t);
        r.setProperty('--input-bg',s.ibg);r.setProperty('--pinyin-color',s.py);
        G.style.boxShadow=name==='light'?'0 0 30px rgba(0,0,0,0.15)':'0 0 50px rgba(0,0,0,0.8)';
        document.body.classList.toggle('light-mode', name==='light');
        localStorage.setItem('typingColorScheme',name);
    }
    const savedColor=localStorage.getItem('typingColorScheme')||'green';CS.value=savedColor;applyColor(savedColor);
    CS.addEventListener('change',e=>applyColor(e.target.value));

    const SK='typingGameProfiles';
    function loadAllProfiles(){
        const raw=localStorage.getItem(SK);if(raw)return JSON.parse(raw);
        const om=JSON.parse(localStorage.getItem('mistakeHistory')||'{}'),op=JSON.parse(localStorage.getItem('typingProgress')||'{}');
        const dp={id:genId(),name:'打字新手',createdAt:new Date().toISOString(),mistakeHistory:om,progressData:op};
        return {currentProfileId:dp.id,profiles:[dp]};
    }
    function saveAllProfiles(d){localStorage.setItem(SK,JSON.stringify(d))}
    function genId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
    let appData=loadAllProfiles(),curProfile=appData.profiles.find(p=>p.id===appData.currentProfileId)||appData.profiles[0];
    function getCurProfile(){return curProfile}
    function updateCurProfileId(id){appData.currentProfileId=id;curProfile=appData.profiles.find(p=>p.id===id);saveAllProfiles(appData)}
    function recordMistake(word){if(!word)return;const p=getCurProfile();p.mistakeHistory[word]=(p.mistakeHistory[word]||0)+1;saveAllProfiles(appData);renderMistakePanel()}
    function saveDailyProgress(sv,tc){const today=new Date().toISOString().slice(0,10);const p=getCurProfile();if(!p.progressData[today])p.progressData[today]={scores:[],totalChars:0};p.progressData[today].scores.push(sv);p.progressData[today].totalChars+=tc;saveAllProfiles(appData)}
    function drawProgressChart(){
        const ctx=PC.getContext('2d'),p=getCurProfile(),days=Object.keys(p.progressData).sort().slice(-7);
        ctx.clearRect(0,0,180,120);if(!days.length){ctx.fillStyle='#aaa';ctx.fillText('暂无数据',30,60);return}
        const maxS=Math.max(...days.map(d=>Math.max(...p.progressData[d].scores)),10);
        const bw=14,gap=(180-days.length*bw)/(days.length+1);ctx.fillStyle='#ffa500';ctx.font='9px sans-serif';
        days.forEach((d,i)=>{const x=gap+i*(bw+gap),best=Math.max(...p.progressData[d].scores),h=(best/maxS)*80;ctx.fillRect(x,90-h,bw,h);ctx.fillStyle='#fff';ctx.fillText(d.slice(5),x,105);ctx.fillStyle='#ffa500'})
    }
    function renderMistakePanel(){MP.innerHTML='';const p=getCurProfile();const entries=Object.entries(p.mistakeHistory).sort((a,b)=>b[1]-a[1]);if(!entries.length){MP.innerHTML='<div style="color:#aaa;text-align:center">暂无错词</div>';return}for(const [w,c] of entries){const div=document.createElement('div');div.className='mistake-item';div.innerHTML=`<span class="mistake-word">${w}</span><span class="mistake-badge">${c}</span><span style="font-size:0.7rem;color:#aaa">${getPinyin(w)}</span>`;MP.appendChild(div)}}
    function renderProfiles(){PL.innerHTML='';appData.profiles.forEach(p=>{const card=document.createElement('div');card.className='profile-card'+(p.id===appData.currentProfileId?' active':'');const best=Math.max(...Object.values(p.progressData).flatMap(d=>d.scores),0);const mc=Object.values(p.mistakeHistory).reduce((a,b)=>a+b,0);card.innerHTML=`<div><b>${p.name}</b><br><small>🏆 ${best} ❌ ${mc}</small></div><div>${p.id!==appData.currentProfileId?'<button class="switch-btn">使用</button>':'<span style="color:var(--accent)">✔ 使用中</span>'}<button class="delete-btn">🗑️</button></div>`;card.addEventListener('click',e=>{if(e.target.classList.contains('delete-btn')||e.target.classList.contains('switch-btn'))return;if(p.id!==appData.currentProfileId){if(gameStarted&&!isGameOver){if(!confirm('切换角色将结束当前游戏，确定吗？'))return;endGame(false)}updateCurProfileId(p.id);renderProfiles();RL.textContent=curProfile.name;clearAllWords();stopLoop();resetGameState()}});card.querySelector('.switch-btn')?.addEventListener('click',e=>{e.stopPropagation();if(gameStarted&&!isGameOver){if(!confirm('切换角色将结束当前游戏，确定吗？'))return;endGame(false)}updateCurProfileId(p.id);renderProfiles();RL.textContent=curProfile.name;clearAllWords();stopLoop();resetGameState()});card.querySelector('.delete-btn')?.addEventListener('click',e=>{e.stopPropagation();if(appData.profiles.length<=1){alert('至少保留一个角色！');return}if(confirm(`确定删除角色“${p.name}”吗？`)){appData.profiles=appData.profiles.filter(x=>x.id!==p.id);if(appData.currentProfileId===p.id){appData.currentProfileId=appData.profiles[0].id;curProfile=appData.profiles[0]}saveAllProfiles(appData);renderProfiles();RL.textContent=curProfile.name}});PL.appendChild(card)});AP.disabled=appData.profiles.length>=5;AP.textContent=appData.profiles.length>=5?'角色已满 (5/5)':'➕ 新建角色';}
    RL.textContent=curProfile.name;
    function showProfileModal(){renderProfiles();PM.classList.add('show')}
    function hideProfileModal(){PM.classList.remove('show');NP.style.display='none';CA.style.display='none';CL.style.display='none'}

    const fw="火锅,麻辣烫,串串香,关东煮,寿喜烧,部队锅,涮羊肉,烤鱼,烤串,烧烤,烤肉,铁板烧,牛排,炸鸡,炸串,炸酱面,拉面,刀削面,手擀面,阳春面,热干面,担担面,重庆小面,螺蛳粉,酸辣粉,过桥米线,桂林米粉,肠粉,河粉,煲仔饭,盖浇饭,蛋炒饭,扬州炒饭,卤肉饭,台湾卤肉饭,黄焖鸡米饭,饺子,馄饨,抄手,云吞,烧卖,包子,小笼包,灌汤包,生煎,馒头,花卷,油条,豆浆,豆腐脑,豆花,煎饼,手抓饼,葱油饼,鸡蛋灌饼,煎饼果子,肉夹馍,锅盔,烤馕,羊肉串,手抓饭,大盘鸡,椒麻鸡,辣子鸡,口水鸡,白切鸡,文昌鸡,叫花鸡,汽锅鸡,烤鸭,盐水鸭,酱鸭,卤鸭,鸭血粉丝汤,老鸭汤,鸭脖,鸭翅,鸭舌,东坡肉,红烧肉,梅菜扣肉,回锅肉,锅包肉,糖醋里脊,咕咾肉,荔枝肉,水煮肉片,水煮鱼,酸菜鱼,麻辣鱼,清蒸鱼,红烧鱼,松鼠桂鱼,西湖醋鱼,剁椒鱼头,鱼香肉丝,宫保鸡丁,夫妻肺片,麻婆豆腐,虎皮青椒,地三鲜,溜肉段,京酱肉丝,木须肉,四喜丸子,糖醋排骨".split(',');
    const aw="猫咪,小猫,大猫,老虎,狮子,猎豹,雪豹,云豹,金猫,薮猫,狞猫,豹猫,虎猫,兔狲,藏獒,哈士奇,金毛,拉布拉多,泰迪,比熊,博美,柯基,柴犬,秋田,中华田园犬,边牧,德牧,罗威纳,杜宾,萨摩耶,阿拉斯加,松狮,巴哥,法斗,英斗,吉娃娃,约克夏,马尔济斯,雪纳瑞,贵宾,比格,小鹿犬,京巴,西施犬,猎狐梗,万能梗,灵缇,大丹犬,圣伯纳,大白熊,高加索,中亚牧羊犬,比特,土佐,菲勒,卡斯罗,加纳利,阿根廷杜高,美国恶霸,斯塔福,牛头梗,大麦町,斑点狗,贵妇犬,卷毛比熊,贝灵顿梗,凯利蓝梗,爱尔兰梗,苏格兰梗,西高地白梗,杰克梗,金毛寻回犬,拉布拉多寻回犬,平毛寻回犬,卷毛寻回犬,爱尔兰水猎犬,葡萄牙水犬,西班牙水犬,英国可卡犬,美国可卡犬,英国史宾格犬,威尔士史宾格犬,爱尔兰雪达犬,戈登雪达犬,英国雪达犬,指示犬,德国短毛指示犬,德国刚毛指示犬,威玛猎犬,匈牙利维兹拉犬,博美犬,哈士奇,萨摩耶,阿拉斯加雪橇犬,西伯利亚雪橇犬,格陵兰犬,加拿大爱斯基摩犬,挪威猎糜犬,瑞典猎糜犬,芬兰猎犬".split(',');
    function getWordPool(){if(curTheme==='internet')return iw;if(curTheme==='idiom')return idw;if(curTheme==='food')return fw;if(curTheme==='animal')return aw;return sw;}
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function getPinyin(t){if(typeof pinyinPro!=='undefined'&&pinyinPro.pinyin)return pinyinPro.pinyin(t,{toneType:'none'}).replace(/\s+/g,'');return''}
    function upScore(){SD.textContent=score} function upMiss(){const l=maxMisses-missCount;MC.textContent=l;MC.style.color=l<=1?'#ff6b6b':'#fff'}
    function upSpeed(){SL.value=speedLevel;SV.textContent=['1档(慢)','2档','3档','4档','5档(快)'][speedLevel-1]}
    function upCombo(){if(combo>=2){CD.textContent=`🔥 COMBO x${combo}`;CD.classList.add('combo-active')}else{CD.classList.remove('combo-active')}}
    function resetCombo(){combo=0;upCombo()}
    function getSpeed(){return 0.2+0.7*(speedLevel-1)}
    function createWordEl(text){const el=document.createElement('div');el.className='word';el.innerHTML=`<span>${text}</span><span class="pinyin">${getPinyin(text)}</span>`;el.style.left=Math.random()*(DW-200)+'px';el.style.top='-60px';G.appendChild(el);return el;}
    function spawnWord(){if(isPaused||isGameOver||!gameStarted)return;if(!remainingPhrases.length)remainingPhrases=shuffle(getWordPool());const text=remainingPhrases.pop(),el=createWordEl(text);activeWords.push({element:el,x:parseFloat(el.style.left),y:-60,speed:getSpeed()});updateActive();}
    function removeWordAt(i){const w=activeWords[i];if(!w)return;w.element.classList.add('exploding');w.element.addEventListener('animationend',function h(){w.element.removeEventListener('animationend',h);if(w.element.parentNode)G.removeChild(w.element)});const pop=document.createElement('div');pop.className='score-popup';pop.textContent=`+${10+(combo>=2?combo*2:0)}`;const r=w.element.getBoundingClientRect(),cr=G.getBoundingClientRect();pop.style.left=(r.left-cr.left)+'px';pop.style.top=(r.top-cr.top)+'px';G.appendChild(pop);pop.addEventListener('animationend',()=>pop.remove());activeWords.splice(i,1);playTone(combo>=2?600+combo*50:500,'sine',0.15,0.3);}
    function clearAllWords(){activeWords.forEach(w=>{if(w.element.parentNode)w.element.remove()});activeWords=[]}
    function updateActive(){activeWords.forEach((w,i)=>w.element.classList.toggle('active',i===0&&activeWords.length>0))}
    function checkAndSpawn(){if(!isPaused&&!isGameOver&&gameStarted&&!activeWords.length)spawnWord()}
    function stopLoop(){if(animId){cancelAnimationFrame(animId);animId=null}}
    function gameLoop(){if(isPaused||isGameOver||!gameStarted){animId=requestAnimationFrame(gameLoop);return}for(let i=activeWords.length-1;i>=0;i--){const w=activeWords[i];w.y+=w.speed;w.element.style.top=w.y+'px';if(w.y>DH){missCount++;upMiss();w.element.remove();activeWords.splice(i,1);resetCombo();playTone(200,'triangle',0.2,0.2);if(missCount>=maxMisses){endGame();return}updateActive()}}checkAndSpawn();animId=requestAnimationFrame(gameLoop);}
    function resetGameState(){stopLoop();clearAllWords();I.value='';score=0;missCount=0;combo=0;upScore();upMiss();upCombo();isGameOver=false;isPaused=false;PO.classList.remove('visible');GO.classList.remove('show');I.disabled=false;wordCount=0;startTime=Date.now();SS.textContent='';}
    function applyModeSettings(){
        if(curMode==='endless'){
            speedLevel=2; // 无尽模式初始速度改为2档
            maxMisses=5;missCount=0;
            endlessFlags={2:false,3:false,4:false,5:false};
            DG.style.display='none';SL.disabled=true;DS.disabled=true;MS.disabled=true
        }else{
            DG.style.display='flex';SL.disabled=false;DS.disabled=false;MS.disabled=false
        }
        upSpeed();upMiss();
    }
    function resetGame(){
        if(!curProfile){alert('请先创建或选择一个角色！');showProfileModal();return}
        I.disabled=false;resetGameState();gameStarted=true;curMode=MS.value;curTheme=TS.value;
        if(curMode==='normal'){
            curDiff=DS.value;
            if(curDiff==='easy'){speedLevel=2;maxMisses=5}
            else if(curDiff==='medium'){speedLevel=3;maxMisses=3}
            else{speedLevel=4;maxMisses=2}
        }
        applyModeSettings();
        remainingPhrases=shuffle(getWordPool());upMiss();spawnWord();
        animId=requestAnimationFrame(gameLoop);I.focus();
    }
    function startNewGame(){if(!appData.profiles.length){alert('请先创建一个角色！');showProfileModal();return}I.disabled=false;SO.classList.add('hidden');resetGame();}
    function endGame(save=true){if(isGameOver)return;isGameOver=true;stopLoop();clearAllWords();FS.textContent=score;const elapsed=(Date.now()-startTime)/60000;const speed=elapsed>0?Math.round(wordCount/elapsed):0;SS.textContent=`打字速度：${speed} 字/分钟`;GO.classList.add('show');I.blur();gameStarted=false;I.disabled=true;if(save)saveDailyProgress(score,0);if(curMode==='endless')MS.disabled=false;}
    function togglePause(){if(isGameOver||!gameStarted)return;isPaused=!isPaused;if(isPaused){PO.classList.add('visible');I.blur();I.disabled=true;}else{PO.classList.remove('visible');I.disabled=false;checkAndSpawn();I.focus();}updateActive();}
    function checkEndlessUp(){
        if(curMode!=='endless')return;
        if(combo>=10&&!endlessFlags[2]&&speedLevel<2){speedLevel=2;endlessFlags[2]=true;maxMisses++;missCount=Math.min(missCount,maxMisses)}
        if(combo>=20&&speedLevel===2&&!endlessFlags[3]){speedLevel=3;endlessFlags[3]=true;maxMisses++}
        if(combo>=10&&speedLevel===3&&!endlessFlags[4]){speedLevel=4;endlessFlags[4]=true;maxMisses++}
        if(combo>=10&&speedLevel===4&&!endlessFlags[5]){speedLevel=5;endlessFlags[5]=true;maxMisses++}
        upSpeed();upMiss();
    }
    I.addEventListener('input',()=>{if(isPaused||isGameOver||!gameStarted||!activeWords.length){if(I.value!=='')I.value='';return}const cur=activeWords[0],target=cur.element.querySelector('span').textContent,val=I.value;if(target.startsWith(val)){if(val===target){combo++;upCombo();score+=10+(combo>=2?combo*2:0);upScore();wordCount++;removeWordAt(0);I.value='';updateActive();checkEndlessUp();checkAndSpawn();}}else{recordMistake(target);I.value='';resetCombo();playTone(200,'triangle',0.15,0.2)}});
    function scaleGame(){const wx=window.innerWidth,wy=window.innerHeight;const sc=Math.min(wx/DW,wy/DH);G.style.transform=`translate(-50%,-50%) scale(${sc})`;G.style.position='absolute';G.style.left='50%';G.style.top='50%'}
    window.addEventListener('resize',scaleGame);window.addEventListener('load',scaleGame);scaleGame();
    EB.addEventListener('click',()=>{if(isPaused)endGame();});

    RB.addEventListener('click',e=>{e.stopPropagation();resetGame()});

    MS.addEventListener('change',e=>{if(gameStarted)return;curMode=e.target.value;if(curMode==='endless')DG.style.display='none';else DG.style.display='flex'});
    DS.addEventListener('change',e=>{curDiff=e.target.value});TS.addEventListener('change',e=>{curTheme=e.target.value});
    G.addEventListener('click',e=>{if((e.target===G||e.target===PO)&&!isPaused&&!isGameOver&&gameStarted)I.focus()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!isGameOver&&gameStarted)togglePause()}if(e.key==='Enter'&&isGameOver&&GO.classList.contains('show')){e.preventDefault();RB.click()}});
    PO.addEventListener('click',e=>{if(e.target===PO) togglePause();});

    PB2.addEventListener('click',e=>{e.stopPropagation();PP.classList.toggle('visible');if(PP.classList.contains('visible'))drawProgressChart()});
    document.addEventListener('click',e=>{if(!MP.contains(e.target)&&e.target!==HB)MP.classList.remove('visible');if(!PP.contains(e.target)&&e.target!==PB2)PP.classList.remove('visible');if(!PM.contains(e.target)&&e.target!==TE)hideProfileModal()});
    PM.addEventListener('click',e=>{e.stopPropagation()});
    if('serviceWorker' in navigator){navigator.serviceWorker.register("data:application/javascript,"+encodeURIComponent("self.addEventListener('fetch',e=>{})"))}
    (function init(){speedLevel=3;maxMisses=3;upSpeed();upMiss();gameStarted=false;SO.classList.remove('hidden');I.disabled=true;RL.textContent=curProfile.name;if(!appData.profiles.length){const dp={id:genId(),name:'打字新手',createdAt:new Date().toISOString(),mistakeHistory:{},progressData:{}};appData.profiles.push(dp);appData.currentProfileId=dp.id;curProfile=dp;saveAllProfiles(appData);RL.textContent=dp.name}})();
